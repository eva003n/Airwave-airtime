# name: airwave-airtime
services:
  
 backend: 
  build:
    context: ./backend
    # include the image 
    dockerfile: Dockerfile
  container_name: airwave_api
  env_file:
     - backend/.env.development

  depends_on:
     - db 
     - redis 
    

  ports:
    - 8000:8000
  networks:
    - app-net
  restart: always
  


  
 db:
    image: postgres:15
    restart: always
    container_name: postgres_db
    env_file:
      - backend/.env.development
    environment:
          - POSTGRES_USER=airwave_admin
          - POSTGRES_PASSWORD=airwave@2925airtime
          - POSTGRES_DB=airwave_development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airwave_admin -d airwave_development"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    ports:
       - 5432:5432
    volumes:
       - postgres_data:/var/lib/postgresql/data
    networks: 
       - app-net
 redis:
   image: redis:8
   container_name: redis_server
   # restart: always
   ports:
      - 6379:6379
   volumes:
      - ./data/redis:/data
   networks:
      - app-net
   command: ["redis-server", "--appendonly", "yes"]

 frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airwave_web
    env_file:
      - frontend/.env.development
    ports:
       - 5173:80
    networks:
       - app-net


volumes:
  postgres_data: {}
networks:
   app-net:
     driver: bridge
        
         