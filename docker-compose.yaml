name: airwave-airtime
services:
 backend: 
  build:
    context: ./backend
    # include the image 
    dockerfile: Dockerfile
  container_name: airwave_api
  #environment:
    # - NODE_ENV=development
    # - PORT=8000
    # - SERVER_URL=http://localhost
    # - DB_USER=sa
    # - DB_PASSWORD=Pass@2025!!
    # - DB_DIALECT=mssql
    # - DB_HOST=db
    # - DB_NAME=Airwave-airtime-app-development
    # - DB_PORT=1433
  depends_on:
    - db
  # command: ["./wait-for-db.sh", "db", "5432", "sh", "-c", "pnpm run migrate" , " pnpm run dev"]

  # command: [ "./wait-for", "db:1433", "--", "node ./index.js" ]
  ports:
    - 8000:8000
  networks:
    - app-net



  
 db:
    image: postgres:15
    restart: always
    container_name: postgres_db
    environment:
         - POSTGRES_USER=airwave_admin
         - POSTGRES_PASSWORD=airwave@2925airtime
         - POSTGRES_DB=airwave_development
   
    ports:
       - 5432:5432
    volumes:
       - postgres_data:/var/lib/postgresql/data
    networks: 
       - app-net

 frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airwave_web
    depends_on:
       - backend
    ports:
       - 3000:80
    networks:
       - app-net


volumes:
  postgres_data: {}
networks:
   app-net:
     driver: bridge
        
         