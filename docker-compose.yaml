name: airwave-airtime
services:
  
 backend: 
  build:
    context: ./backend
    # include the image 
    dockerfile: Dockerfile
  container_name: airwave_api
  env_file:
     - backend/.env.development

  depends_on:
     db:
        condition: service_healthy
        restart: true
  # command: ["./wait-for-db.sh", "db", "5432", "sh", "-c", "pnpm run migrate" , " pnpm run dev"]

  ports:
    - 8000:8000
  networks:
    - app-net
  # command: sh -c "pnpm run migrate"
  


  
 db:
    image: postgres:15
    restart: always
    container_name: postgres_db
    env_file:
      - backend/.env.development
    environment:
          - POSTGRES_USER=airwave_admin
          - POSTGRES_PASSWORD=airwave@2925airtime
          - POSTGRES_DB=airwave_development
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    ports:
       - 5432:5432
    volumes:
       - postgres_data:/var/lib/postgresql/data
    networks: 
       - app-net

 frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airwave_web
    env_file:
      - frontend/.env.development
    ports:
       - 3000:80
    networks:
       - app-net


volumes:
  postgres_data: {}
networks:
   app-net:
     driver: bridge
        
         