name: airwave-airtime
services:
 backend: 
  build:
    context: ./backend
    # include the image 
    dockerfile: Dockerfile
  container_name: airwave_api
  environment: 
    - NODE_ENV=development
    - SERVER_URL=http://localhost
    - 
  depends_on:
    - db
  # command: ["./wait-for-db.sh", "db", "5432", "sh", "-c", "pnpm run migrate" , " pnpm run dev"]

  ports:
    - 8000:8000
  networks:
    - app-net



  
 db:
    image: postgres:15
    restart: always
    container_name: postgres_db
    environment:
         - POSTGRES_USER=airwave_admin
         - POSTGRES_PASSWORD=airwave@2925airtime
         - POSTGRES_DB=airwave_development
   
    ports:
       - 5432:5432
    volumes:
       - postgres_data:/var/lib/postgresql/data
    networks: 
       - app-net

 frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airwave_web
    environment:
      - VITE_API_BASE_URI=http://localhost:8000/api/v1
    depends_on:
       - backend
    ports:
       - 3000:80
    networks:
       - app-net


volumes:
  postgres_data: {}
networks:
   app-net:
     driver: bridge
        
         