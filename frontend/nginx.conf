server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # --- Frontend / SPA route handling ---
    location / {
        try_files $uri /index.html;
    }

    # --- Backend SSE endpoint ---
    location /api/v1/ {
        # When nginx runs in Docker, use the backend service name (e.g. http://backend:8000)
        # If nginx runs on the host and backend is on localhost, use http://localhost:8000
        proxy_pass http://backend:8000;

        # Use HTTP/1.1 for upstream so connections can be kept open for streaming
        proxy_http_version 1.1;
        proxy_set_header Accept "text/event-stream";
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Don't buffer or cache SSE responses, and don't gzip them
        proxy_buffering off;
        proxy_cache off;

        proxy_redirect off;
        proxy_set_header   Host             $host;
		proxy_set_header   X-Real-IP        $remote_addr;
		proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        gzip off;

        # Keep connection open for long-lived streams
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # explicitly set mime type  header
        add_header Content-Type text/event-stream;
    }
}
